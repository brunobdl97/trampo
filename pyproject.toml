[project]
name = "trampo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.142.1",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
trampo = "trampo.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*.md"]  # ruff also formats fenced Python code in docs; skip doc code samples

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
